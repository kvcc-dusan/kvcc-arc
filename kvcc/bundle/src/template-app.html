<!doctype html>
<html lang="en" data-theme="light" data-accent="neutral">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kvcc app template</title>
<!--__KVCC_FONTS__-->
<style>
/*__KVCC_CSS__*/
.page { display: grid; gap: var(--space-6); max-width: 64rem; }
.page h2 { margin: 0 0 var(--space-3); font-family: var(--font-body); font-size: var(--text-lg); letter-spacing: var(--tracking-body); }
.page p { margin: 0; color: var(--text-secondary); font-size: var(--text-sm); }
.stats { display: grid; gap: var(--space-4); grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); }
.split { display: grid; gap: var(--space-6); grid-template-columns: repeat(auto-fit, minmax(20rem, 1fr)); align-items: start; }
.actions-row { display: flex; align-items: center; gap: var(--space-2); }
.mark { display: grid; place-items: center; width: 1.75rem; height: 1.75rem; border-radius: calc(var(--radius-control) - 4px); background: var(--foreground); color: var(--background); font-size: var(--text-xs); font-weight: 500; flex: none; }
.who { display: flex; align-items: center; gap: var(--space-3); font-size: var(--text-sm); min-width: 0; }
.who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<div id="app"></div>
<script>
/*__KVCC_JS__*/
(() => {
  const media = matchMedia("(prefers-color-scheme: dark)");
  kvcc.setTheme(media.matches ? "dark" : "light");
  media.addEventListener("change", e => kvcc.setTheme(e.matches ? "dark" : "light"));

  // Lucide path data, 24px viewBox.
  const ICON = {
    home: ["m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z", "M9 22V12h6v10"],
    folder: ["M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"],
    users: ["M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2", "M22 21v-2a4 4 0 0 0-3-3.87", "M16 3.13a4 4 0 0 1 0 7.75", "M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"],
    bell: ["M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9", "M10.3 21a1.94 1.94 0 0 0 3.4 0"],
    settings: ["M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z", "M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"],
  };
  const PAGES = { overview: "Overview", projects: "Projects", team: "Team", notifications: "Notifications", settings: "Settings" };

  const invite = document.createElement("button");
  invite.type = "button";
  invite.className = "kv-button__button kv-button__primary kv-button__sm";
  invite.textContent = "Invite teammate";
  invite.addEventListener("click", () => kvcc.toast({ title: "Invite sent", description: "Sample action, nothing was sent." }));

  const shell = kvcc.appShell(document.getElementById("app"), {
    brand: ({ rail }) => { const f = document.createDocumentFragment(); const m = document.createElement("span"); m.className = "mark"; m.textContent = "N"; f.append(m); if (!rail) f.append("Northline"); return f; },
    groups: [
      { id: "main", items: [
        { id: "overview", label: PAGES.overview, icon: ICON.home },
        { id: "projects", label: PAGES.projects, icon: ICON.folder, badge: 12 },
        { id: "team", label: PAGES.team, icon: ICON.users },
      ] },
      { id: "account", label: "Account", items: [
        { id: "notifications", label: PAGES.notifications, icon: ICON.bell, badge: 3 },
        { id: "settings", label: PAGES.settings, icon: ICON.settings },
      ] },
    ],
    footer: ({ rail }) => { const d = document.createElement("div"); d.className = "who"; const m = document.createElement("span"); m.className = "mark"; m.textContent = "SU"; d.append(m); if (!rail) { const n = document.createElement("span"); n.textContent = "Sample user"; d.append(n); } return d; },
    activeId: "overview",
    title: PAGES.overview,
    actions: invite,
    onNavigate: id => { shell.setTitle(PAGES[id]); render(id); },
  });

  // Each page renders into shell.main. Replace the sample content below with real screens.
  const render = id => {
    if (id !== "overview") {
      shell.main.innerHTML = `<div class="page"><h2></h2><p>Sample page. Build this screen from the components in the bundle.</p></div>`;
      shell.main.querySelector("h2").textContent = PAGES[id];
      return;
    }
    shell.main.innerHTML = `<div class="page">
      <div class="stats">
        <article class="kv-metric-card__card"><div class="kv-metric-card__top"><span>Active users</span><small data-trend="up">+12%</small></div><span class="kv-metric-card__value">2,481</span><p>Sample data, last 30 days.</p></article>
        <article class="kv-metric-card__card"><div class="kv-metric-card__top"><span>Open projects</span><small>12</small></div><span class="kv-metric-card__value">12</span><p>Sample data.</p></article>
        <article class="kv-metric-card__card"><div class="kv-metric-card__top"><span>Overdue tasks</span><small data-trend="down">-8%</small></div><span class="kv-metric-card__value">7</span><p>Sample data.</p></article>
      </div>
      <div class="split"><div id="t-bars"></div><div id="t-spark"></div></div>
      <div id="t-table"></div>
    </div>`;
    const values = [42, 58, 51, 73, 66, 38, 29, 61, 77, 69, 84, 72, 45, 33];
    kvcc.barChart(document.getElementById("t-bars"), { label: "Active minutes", period: "Sep 1 to 14", unit: "min", data: values.map((value, i) => ({ value, label: `Sep ${i + 1}`, axisLabel: `Sep ${i + 1}` })) });
    kvcc.sparkline(document.getElementById("t-spark"), { label: "Weekly signups", headline: "412", values: [18, 24, 22, 31, 29, 38, 35, 44, 41, 52, 49, 61], labels: Array.from({ length: 12 }, (_, i) => `Wk ${i + 1}`) });
    kvcc.table(document.getElementById("t-table"), {
      caption: "Sample projects", selectable: true, itemName: { one: "project", other: "projects" },
      columns: [{ key: "name", label: "Project" }, { key: "status", label: "Status" }, { key: "tasks", label: "Open tasks", numeric: true }],
      rows: [{ id: "a", name: "Sample project A", status: "In review", tasks: 14 }, { id: "b", name: "Sample project B", status: "Published", tasks: 3 }, { id: "c", name: "Sample project C", status: "Draft", tasks: 22 }],
    });
  };
  render("overview");
})();
</script>
</body>
</html>
